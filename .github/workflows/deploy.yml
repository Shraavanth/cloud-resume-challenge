name: CI/CD Pipeline - Zero-Cost Serverless Portfolio

on:
  push:
    branches:
      - development/nikhil
      - develop
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  test-and-build:
    name: Run Unit Tests & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Backend Dependencies
        run: npm ci

      - name: Run Backend Vitest Unit Tests
        run: npm test

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Build Frontend Production Bundle
        run: npm --prefix frontend run build

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Validate SAM Template
        run: sam validate --lint

  deploy-pages:
    name: Deploy Frontend to GitHub Pages ($0 Budget Verified)
    needs: test-and-build
    if: github.ref == 'refs/heads/development/nikhil' || github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Frontend for Production
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-aws:
    name: Deploy to AWS ($0 Free Tier Backend)
    needs: test-and-build
    if: github.ref == 'refs/heads/development/nikhil' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check for AWS Authentication (OIDC Role or Keys)
        id: check-aws
        env:
          AWS_ROLE: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          FRONTEND_BUCKET: ${{ secrets.FRONTEND_BUCKET }}
        run: |
          if [ -n "$AWS_ROLE" ]; then
            echo "has_auth=true" >> $GITHUB_OUTPUT
            echo "has_oidc=true" >> $GITHUB_OUTPUT
          elif [ -n "$AWS_KEY" ]; then
            echo "has_auth=true" >> $GITHUB_OUTPUT
            echo "has_oidc=false" >> $GITHUB_OUTPUT
          else
            echo "has_auth=false" >> $GITHUB_OUTPUT
            echo "has_oidc=false" >> $GITHUB_OUTPUT
            echo "::notice::Neither AWS_ROLE_TO_ASSUME (OIDC) nor AWS_ACCESS_KEY_ID detected in GitHub Secrets. AWS deployment skipped safely to guarantee $0 charges."
          fi
          if [ -n "$FRONTEND_BUCKET" ]; then
            echo "has_bucket=true" >> $GITHUB_OUTPUT
          else
            echo "has_bucket=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS Credentials via GitHub OIDC (Recommended)
        if: steps.check-aws.outputs.has_auth == 'true' && steps.check-aws.outputs.has_oidc == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Configure AWS Credentials via Access Keys (Fallback)
        if: steps.check-aws.outputs.has_auth == 'true' && steps.check-aws.outputs.has_oidc == 'false'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Set up AWS SAM CLI
        if: steps.check-aws.outputs.has_auth == 'true'
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Build SAM Application
        if: steps.check-aws.outputs.has_auth == 'true'
        run: sam build

      - name: Deploy SAM Stack to AWS
        if: steps.check-aws.outputs.has_auth == 'true'
        run: |
          sam deploy \
            --stack-name cloud-resume-portfolio \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --region ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Sync Frontend to S3 and CloudFront (If Configured)
        if: steps.check-aws.outputs.has_auth == 'true' && steps.check-aws.outputs.has_bucket == 'true'
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          aws s3 sync frontend/dist s3://${{ secrets.FRONTEND_BUCKET }} --delete
          if [ -n "${{ secrets.CLOUDFRONT_DIST_ID }}" ]; then
            aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} --paths "/*"
          fi

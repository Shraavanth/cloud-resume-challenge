name: CI/CD Pipeline - Zero-Cost Serverless Portfolio

on:
  push:
    branches:
      - development/nikhil
      - develop
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Run Unit Tests & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Backend Dependencies
        run: npm ci

      - name: Run Backend Vitest Unit Tests
        run: npm test

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Build Frontend Production Bundle
        run: npm --prefix frontend run build

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Validate SAM Template
        run: sam validate --lint

  deploy-aws:
    name: Deploy to AWS ($0 Budget Free Tier)
    needs: test-and-build
    if: github.ref == 'refs/heads/development/nikhil' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check if AWS credentials exist
        id: check-aws
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -n "$AWS_KEY" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::notice::AWS_ACCESS_KEY_ID not detected in GitHub Secrets. Automated cloud deployment skipped safely."
          fi

      - name: Configure AWS Credentials
        if: steps.check-aws.outputs.has_creds == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Set up AWS SAM CLI
        if: steps.check-aws.outputs.has_creds == 'true'
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Build SAM Application
        if: steps.check-aws.outputs.has_creds == 'true'
        run: sam build

      - name: Deploy SAM Stack to AWS
        if: steps.check-aws.outputs.has_creds == 'true'
        run: |
          sam deploy \
            --stack-name cloud-resume-portfolio \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --region ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Build Frontend & Deploy Static Assets
        if: steps.check-aws.outputs.has_creds == 'true'
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          # S3 sync if FRONTEND_BUCKET secret exists
          if [ -n "${{ secrets.FRONTEND_BUCKET }}" ]; then
            aws s3 sync frontend/dist s3://${{ secrets.FRONTEND_BUCKET }} --delete
            if [ -n "${{ secrets.CLOUDFRONT_DIST_ID }}" ]; then
              aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} --paths "/*"
            fi
          fi
